[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pairtalk-research-landscape"
version = "0.1.0"
description = "Reproducible research landscape and architecture notes for PairTalk"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "christopherohit" }]
dependencies = ["requests>=2.28", "beautifulsoup4>=4.11"]

[tool.setuptools]
py-modules = ["collect_landscape"]
